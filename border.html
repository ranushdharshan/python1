<!DOCTYPE html>
<html>
<head>
 <title>different types of border</title>
</head>
<body>
<style>
 p.r { border-style: dotted}
 p.a { border-style: dashed}
 p.n { border-style: solid}
 p.u { border-style: double}
 p.s { border-style: groove}
 p.h { border-style: ridge} 
 p.d { border-style: inset}
 p.z { border-style: outset}
 p.x{ border-style: none}
 p.y { border-style: hidden}

p{ padding: 8px;border-width: 4px;border-color:blue }
 </style>
</head>

<body>
 <h2>CSS Border Styles</h2>
 <p class="r">Dotted border</p>
 <p class="a">Dashed border</p>
 <p class="n">Solid border</p>
 <p class="u">Double border</p>
 <p class="s">Groove border</p>
 <p class="h">Ridge border</p>
 <p class="d">Inset border</p>
 <p class="z">Outset border</p>
 <p class="x">No border</p>
 <p class="y">Hidden border</p>
</body>
</html>
