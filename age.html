<!DOCTYPE html>
<html>
<body>
<p id="rd"></p>
<script>
 let day=3
let dayName="";
switch (day) {
 case 1:
 dayName = "Monday";
 break;
 case 2:
 dayName = "Tuesday";
 break;
 case 3:
 dayName = "Wednesday";
 break;
 case 4:
 dayName = "thursday";
 break; 
case 5:
 dayName = "friday";
  break;
 case 6:
 dayName = "saturday";
 break;
 case 7:
 dayName = "sunday"; 
 break;
 default:
 dayName = "Invalid day";
}
document.getElementById("rd").innerHTML =dayName;
</script>

</body>
</html>
